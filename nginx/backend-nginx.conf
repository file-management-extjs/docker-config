# nginx/nginx.conf

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2M; # Increase limit to 2MB to accommodate larger chunks
    resolver 127.0.0.11 valid=10s ipv6=off; # Docker DNS; keeps backend IP fresh after container recreates

    server {
        listen 80;
        server_name localhost;

        location / {
            set $backend_upstream backend:3000;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 75s;
            proxy_send_timeout 20m;
            proxy_read_timeout 20m;
            send_timeout 20m;
        }
    }
}
